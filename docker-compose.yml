version: '3.8'
services:
  db:
    image: mariadb:latest
    container_name: pbx_db_container
    restart: always
    environment:
      MYSQL_DATABASE: pbx_middleware
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_USER: pbx_user
      MYSQL_PASSWORD: user_password_segura
    ports:
      - "3306:3306"
    volumes:
      - ./docker-data/db:/var/lib/mysql
